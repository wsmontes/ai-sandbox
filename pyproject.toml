[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microevolve-dts"
version = "0.1.0"
description = "Local heuristic evolution for Difference Triangle Set discovery"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wagner Montes"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
microevolve-dts = "microevolve_dts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
